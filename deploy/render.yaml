# Example Render Blueprint: one web service and one Postgres database.
# Optional. Render reads render.yaml from the repository root by default, so copy this
# file there (or set the Blueprint file path in Render) if you want to use it.
# Other hosts do not need this file.
# Plans below are free so a first deploy costs nothing. Free web services sleep when
# idle and free databases can expire. For a real site, change both plans to a paid
# plan (for example web "starter", database "basic-256mb") and verify backups.
databases:
  - name: allovity-db
    databaseName: allovity
    user: allovity
    plan: free

services:
  - type: web
    name: allovity
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUSTED_PROXY_HOPS
        value: '1'
      - key: DATABASE_URL
        fromDatabase:
          name: allovity-db
          property: connectionString
      # Secrets and site-specific values: Render asks for these when you apply the
      # Blueprint. They are never stored in the repository.
      - key: PUBLIC_SITE_URL
        sync: false
      - key: ADMIN_PATH_SLUG
        sync: false
      # Admin. The encryption secret is generated by Render on first deploy and never
      # appears in the repository. Do not regenerate it later: stored two-step secrets
      # are encrypted with keys derived from it.
      - key: ADMIN_SECRET_KEY
        generateValue: true
      # Only needed for the first sign-in. Delete ADMIN_INITIAL_PASSWORD once you have signed in.
      - key: ADMIN_INITIAL_EMAIL
        sync: false
      - key: ADMIN_INITIAL_PASSWORD
        sync: false
